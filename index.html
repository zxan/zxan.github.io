<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>portfolia@portfolio: ~</title>
  <meta name="description"
    content="Interactive terminal &amp; tiling-desktop portfolio — explore projects, skills, and experience.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="portfolia@portfolio: ~">
  <meta property="og:description"
    content="Interactive terminal &amp; tiling-desktop portfolio — explore projects, skills, and experience.">
  <meta name="twitter:card" content="summary">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='3' y='22' font-family='monospace' font-weight='bold' font-size='16' fill='%236eb4e8'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset & Base ─────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --bg-chrome: #111111;
      --bg-panel: #0a0a0c;
      --fg: #e0e0e0;
      --accent: #6eb4e8;
      --green: #73c990;
      --yellow: #d7c485;
      --red: #d98585;
      --magenta: #b895c9;
      --dim: #555555;
      --border: #333333;
      --selection: rgba(110, 180, 232, 0.2);
      --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SF Mono', 'Menlo', monospace;
    }

    html,
    body {
      height: 100%;
      background: #000000;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--fg);
      overflow: hidden;
    }

    .is-hidden {
      display: none !important;
    }

    /* ─── Window Chrome ────────────────────────────────────── */
    #terminal-window {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      overflow: hidden;
    }

    #title-bar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 14px;
      background: var(--bg-chrome);
      border-bottom: 1px solid var(--border);
      user-select: none;
      flex-shrink: 0;
    }

    .traffic-lights {
      display: flex;
      gap: 7px;
    }

    .traffic-lights span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: block;
      background: #444444;
      border: 1px solid #666666;
      transition: background .15s, border-color .15s;
    }

    .traffic-lights span.tl-red:hover { background: #d98585; border-color: #d98585; cursor: pointer; }
    .traffic-lights span.tl-yellow:hover { background: #d7c485; border-color: #d7c485; }
    .traffic-lights span.tl-green:hover { background: #73c990; border-color: #73c990; }

    #title-bar-text {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: .3px;
      max-width: 35vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ─── Portal toggle — identical widget, dead-centered in both ───
       portals' bars, so it never appears to move when switching ───── */
    .portal-toggle {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px;
    }

    .pt-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 78px;
      height: calc(100% - 6px);
      background: var(--accent);
      border-radius: 3px;
      transition: transform .2s ease;
      z-index: 0;
    }

    .pt-btn {
      position: relative;
      z-index: 1;
      width: 78px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .3px;
      padding: 6px 0;
      cursor: pointer;
      border-radius: 3px;
      transition: color .15s;
    }

    .pt-btn.pt-active {
      color: #000;
      font-weight: 700;
    }

    .pt-btn:not(.pt-active):hover {
      color: var(--fg);
    }

    .pt-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ─── Terminal Body ────────────────────────────────────── */
    #terminal {
      flex: 1;
      background: var(--bg);
      padding: 16px 18px 8px;
      overflow-y: auto;
      scroll-behavior: smooth;
      cursor: text;
    }

    #terminal::-webkit-scrollbar,
    .wm-tile-body::-webkit-scrollbar,
    #wm-grid::-webkit-scrollbar,
    .fw-body::-webkit-scrollbar {
      width: 6px;
    }

    #terminal::-webkit-scrollbar-track,
    .wm-tile-body::-webkit-scrollbar-track,
    #wm-grid::-webkit-scrollbar-track,
    .fw-body::-webkit-scrollbar-track {
      background: transparent;
    }

    #terminal::-webkit-scrollbar-thumb,
    .wm-tile-body::-webkit-scrollbar-thumb,
    #wm-grid::-webkit-scrollbar-thumb,
    .fw-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    #terminal::-webkit-scrollbar-thumb:hover,
    .wm-tile-body::-webkit-scrollbar-thumb:hover,
    #wm-grid::-webkit-scrollbar-thumb:hover,
    .fw-body::-webkit-scrollbar-thumb:hover {
      background: var(--dim);
    }

    /* ─── Output Lines ─────────────────────────────────────── */
    #output {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.65;
    }

    .line-prompt {
      color: var(--accent);
    }

    .line-prompt .at {
      color: var(--dim);
    }

    .line-prompt .host {
      color: var(--green);
    }

    .line-prompt .colon {
      color: var(--dim);
    }

    .line-prompt .path {
      color: var(--yellow);
    }

    .line-prompt .dollar {
      color: var(--fg);
    }

    .line-prompt .cmd {
      color: var(--fg);
    }

    .line-output {
      color: var(--fg);
    }

    .line-error {
      color: var(--red);
    }

    .line-accent {
      color: var(--accent);
    }

    .line-green {
      color: var(--green);
    }

    .line-yellow {
      color: var(--yellow);
    }

    .line-magenta {
      color: var(--magenta);
    }

    .line-dim {
      color: var(--dim);
    }

    .term-link {
      color: var(--accent);
      text-decoration: none;
    }

    .term-link:hover,
    .term-link:focus-visible {
      text-decoration: underline;
    }

    .line-bold {
      font-weight: 700;
    }

    .line-header {
      color: var(--accent);
      font-weight: 700;
    }

    .dir-name {
      color: var(--accent);
      font-weight: 700;
    }

    .file-name {
      color: var(--fg);
    }

    .file-link {
      color: var(--green);
    }

    /* ─── Input Row ────────────────────────────────────────── */
    #input-line {
      display: flex;
      align-items: center;
      line-height: 1.65;
      min-height: 1.65em;
    }

    #input-prompt {
      white-space: nowrap;
      flex-shrink: 0;
    }

    #input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: inherit;
      caret-color: var(--accent);
      line-height: 1.65;
      padding: 0;
      margin: 0;
    }

    /* ─── Boot animation ──────────────────────────────────── */
    .boot-line {
      opacity: 0;
      animation: bootFade .25s ease forwards;
    }

    .boot-ok {
      color: var(--green);
    }

    .boot-label {
      color: var(--dim);
    }

    @keyframes bootFade {
      to {
        opacity: 1;
      }
    }

    /* ─── Mobile Quick Buttons ─────────────────────────────── */
    #mobile-bar {
      display: none;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-chrome);
      border-top: 1px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
    }

    #mobile-bar button {
      background: transparent;
      border: 1px solid #444444;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 0;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    #mobile-bar button:active {
      background: rgba(255, 255, 255, .1);
      border-color: var(--fg);
    }

    /* ─── Neofetch ─────────────────────────────────────────── */
    .neofetch-row {
      display: flex;
      gap: 24px;
      line-height: 1.5;
    }

    .neofetch-art {
      color: var(--accent);
      white-space: pre;
      flex-shrink: 0;
    }

    .neofetch-info {
      white-space: pre-wrap;
    }

    .nf-label {
      color: var(--accent);
      font-weight: 700;
    }

    .nf-sep {
      color: var(--dim);
    }

    .nf-val {
      color: var(--fg);
    }

    .nf-palette {
      display: inline-block;
      width: 18px;
      height: 12px;
      border-radius: 2px;
      vertical-align: middle;
    }

    /* ─── Visual Desktop (workspace 2) ─────────────────────── */
    #visual-desktop {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #wm-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      padding: 0 14px;
      background: var(--bg-chrome);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }

    .wm-bar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .wm-tag {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: .3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .wm-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--dim);
      flex-shrink: 0;
    }

    #wm-clock {
      color: var(--fg);
    }

    #wm-grid {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: grid;
      gap: 14px;
      grid-template-columns: 1.6fr 1fr;
      grid-template-rows: auto auto auto;
      grid-template-areas:
        "about    experience"
        "projects experience"
        "skills   stats"
        "contact  contact";
      align-content: start;
    }

    .wm-tile {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .wm-tile-about { grid-area: about; }
    .wm-tile-stats { grid-area: stats; }
    .wm-tile-projects { grid-area: projects; }
    .wm-tile-skills { grid-area: skills; }
    .wm-tile-experience { grid-area: experience; }
    .wm-tile-contact { grid-area: contact; }

    .wm-tile-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--dim);
      flex-shrink: 0;
    }

    .wm-tile-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .wm-tile-body {
      padding: 12px 14px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    .wm-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .wm-card {
      text-align: left;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
      font-family: var(--font-mono);
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color .15s, background .15s;
      width: 100%;
    }

    .wm-card:hover,
    .wm-card:focus-visible {
      border-color: var(--green);
      background: rgba(115, 201, 144, 0.06);
      outline: none;
    }

    .wm-card-title {
      font-size: 13px;
      color: var(--fg);
    }

    .wm-card-meta {
      font-size: 11px;
      color: var(--dim);
    }

    .wm-card-row {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .wm-card-row:last-child {
      margin-bottom: 0;
    }

    .wm-card-row:hover,
    .wm-card-row:focus-visible {
      border-color: var(--magenta);
      background: rgba(184, 149, 201, 0.06);
    }

    .wm-card-arrow {
      color: var(--dim);
    }

    #wm-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      background: var(--bg-chrome);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 12px;
      color: var(--dim);
      flex-wrap: wrap;
      gap: 6px;
    }

    #wm-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    #wm-footer a:hover,
    #wm-footer a:focus-visible {
      text-decoration: underline;
    }

    .wm-heart {
      color: var(--red);
    }

    .wm-contact-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .wm-contact-link {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 140px;
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-decoration: none;
      font-family: var(--font-mono);
      transition: border-color .15s, background .15s;
    }

    .wm-contact-link:hover,
    .wm-contact-link:focus-visible {
      border-color: var(--accent);
      background: rgba(110, 180, 232, 0.06);
      outline: none;
    }

    .wm-contact-label {
      font-size: 11px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .wm-contact-value {
      font-size: 13px;
      color: var(--accent);
    }

    /* ─── Floating window (project / experience detail) ────── */
    .fw-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .fw-window {
      width: min(560px, 100%);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    .fw-window:focus {
      outline: none;
    }

    .fw-titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px;
      background: var(--bg-chrome);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .fw-title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: var(--dim);
    }

    .fw-body {
      padding: 16px 18px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.65;
    }

    /* ─── Responsive ───────────────────────────────────────── */
    @media (max-width: 900px) {
      #wm-grid {
        grid-template-columns: 1fr;
        grid-template-areas:
          "about"
          "experience"
          "projects"
          "skills"
          "stats"
          "contact";
      }
    }

    @media (max-width: 640px) {
      body {
        font-size: 13px;
      }

      #terminal-window {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }

      #title-bar,
      #wm-bar {
        height: 44px;
        padding: 0 10px;
        gap: 8px;
      }

      #title-bar-text {
        max-width: 30vw;
        font-size: 11px;
      }

      .traffic-lights {
        gap: 5px;
      }

      .traffic-lights span {
        width: 10px;
        height: 10px;
      }

      .portal-toggle {
        position: static;
        transform: none;
        margin-left: auto;
        flex-shrink: 0;
      }

      .pt-slider,
      .pt-btn {
        width: 62px;
      }

      .pt-btn {
        font-size: 11px;
        padding: 6px 0;
      }

      #terminal {
        padding: 12px 10px 6px;
        font-size: 12px;
      }

      #input-line {
        align-items: flex-start;
      }

      #input-field {
        min-width: 0;
      }

      #mobile-bar {
        display: flex;
        padding: 8px 10px;
      }

      #mobile-bar button {
        font-size: 11px;
        padding: 6px 10px;
      }

      #wm-bar {
        justify-content: flex-start;
      }

      .wm-tag {
        max-width: 92px;
        font-size: 11px;
      }

      .wm-bar-right {
        margin-left: auto;
        gap: 8px;
        font-size: 11px;
      }

      #wm-bar .portal-toggle {
        margin-left: 8px;
      }

      #wm-coffee {
        display: none;
      }

      #wm-grid {
        padding: 8px;
        gap: 8px;
      }

      .wm-tile-head {
        padding: 7px 10px;
      }

      .wm-tile-body {
        padding: 10px;
        font-size: 12px;
        line-height: 1.55;
      }

      .wm-card-grid {
        grid-template-columns: 1fr;
      }

      .wm-card {
        padding: 9px 10px;
      }

      .wm-card-title,
      .wm-card-meta,
      .wm-contact-value {
        overflow-wrap: anywhere;
      }

      .wm-contact-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .wm-contact-link {
        min-width: 0;
        width: 100%;
        padding: 8px 10px;
      }

      .neofetch-row {
        flex-direction: column;
        gap: 10px;
      }

      .neofetch-art {
        max-width: 100%;
        overflow-x: auto;
        font-size: 11px;
      }

      .neofetch-info {
        overflow-wrap: anywhere;
      }

      #wm-footer {
        padding: 8px 10px;
        font-size: 11px;
        text-align: center;
      }

      .fw-overlay {
        padding: 8px;
      }

      .fw-window {
        max-height: calc(100dvh - 16px);
      }

      .fw-title {
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .fw-body {
        padding: 12px;
        font-size: 12px;
      }
    }

    @media (max-width: 380px) {
      #title-bar-text,
      .wm-tag {
        display: none;
      }

      .pt-slider,
      .pt-btn {
        width: 58px;
      }
    }

    /* ─── Reduced motion ───────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .boot-line {
        animation: none;
        opacity: 1;
      }

      .wm-card,
      .traffic-lights span,
      .pt-btn,
      .pt-slider {
        transition: none;
      }
    }

    /* ─── Selection ────────────────────────────────────────── */
    ::selection {
      background: var(--selection);
    }
  </style>
</head>

<body>

  <div id="terminal-window">
    <div id="title-bar">
      <div class="traffic-lights">
        <span class="tl-red"></span>
        <span class="tl-yellow"></span>
        <span class="tl-green"></span>
      </div>
      <span id="title-bar-text">portfolia@portfolio: ~</span>
    </div>

    <div id="terminal" tabindex="-1">
      <div id="output" role="log" aria-live="polite"></div>
      <div id="input-line">
        <span id="input-prompt"></span>
        <input id="input-field" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
          aria-label="Terminal input">
      </div>
    </div>

    <div id="mobile-bar">
      <button data-cmd="help">help</button>
      <button data-cmd="ls">ls</button>
      <button data-cmd="cat about.txt">about</button>
      <button data-cmd="projects">projects</button>
      <button data-cmd="contact">contact</button>
      <button data-cmd="neofetch">neofetch</button>
      <button data-cmd="visual">visual</button>
      <button data-cmd="clear">clear</button>
    </div>
  </div>

  <div id="visual-desktop" class="is-hidden">
    <div id="wm-bar">
      <div class="wm-bar-left">
        <span class="wm-tag">portfolia@portfolio &nbsp;·&nbsp; workspace 2</span>
      </div>
      <div class="wm-bar-right">
        <span class="wm-stat" id="wm-coffee"></span>
        <span class="wm-stat" id="wm-clock"></span>
      </div>
    </div>

    <div id="wm-grid">
      <section class="wm-tile wm-tile-about">
        <header class="wm-tile-head"><span class="wm-tile-dot" style="background:var(--accent)"></span>~/about</header>
        <div class="wm-tile-body" id="wm-about-body"></div>
      </section>

      <section class="wm-tile wm-tile-stats">
        <header class="wm-tile-head"><span class="wm-tile-dot" style="background:var(--yellow)"></span>~/neofetch</header>
        <div class="wm-tile-body" id="wm-stats-body"></div>
      </section>

      <section class="wm-tile wm-tile-projects">

    // ═══════════════════════════════════════════════════════════

    const LINKS = [

    // ASCII art — shared by the terminal `neofetch` command and the
    // visual desktop's ~/neofetch tile.
    const NEOFETCH_ART = [
      `    ╭──────────╮   `,
      `    │  ╭────╮  │   `,
      `    │  │ ▓▓ │  │   `,
      `    │  ╰────╯  │   `,

    // ═══════════════════════════════════════════════════════════
    // PART 2 — VIRTUAL FILESYSTEM
    // ═══════════════════════════════════════════════════════════
    const FS = (() => {
      // Build tree from CONTENT
      const tree = {
        type: 'dir',
        children: {
          'about.txt': { type: 'file', content: CONTENT.about },
          'skills.txt': { type: 'file', content: CONTENT.skills },
          'contact.txt': { type: 'file', content: CONTENT.contact },
          'resume.pdf': { type: 'file', content: '[binary — use the `resume` command to open]', link: CONTENT.resumeUrl },
          'projects': {
            type: 'dir',
            children: Object.fromEntries(
              Object.entries(CONTENT.projects).map(([name, p]) => [name, { type: 'file', content: p.content }])
            ),
          },
          'experience': {
            type: 'dir',
            children: Object.fromEntries(
              Object.entries(CONTENT.experience).map(([name, e]) => [name, { type: 'file', content: e.content }])
            ),
          },
        },
      };

      let cwd = ['~'];   // path segments, first is always ~

      /** Resolve a path string to segments array */
      function resolve(pathStr) {
        if (!pathStr || pathStr === '~') return ['~'];
        let parts;
        if (pathStr.startsWith('~/')) {
          parts = ['~', ...pathStr.slice(2).split('/').filter(Boolean)];
        } else if (pathStr.startsWith('/')) {
          parts = ['~', ...pathStr.slice(1).split('/').filter(Boolean)];
        } else {
          parts = [...cwd, ...pathStr.split('/').filter(Boolean)];
        }
        // resolve . and ..
        const resolved = [];
        for (const p of parts) {
          if (p === '.') continue;
          if (p === '..') { if (resolved.length > 1) resolved.pop(); continue; }
          resolved.push(p);
        }
        if (resolved.length === 0) resolved.push('~');
        return resolved;
      }

      /** Get node at segments */
      function getNode(segments) {
        let node = tree;
        for (let i = 1; i < segments.length; i++) {
          if (!node || node.type !== 'dir' || !node.children[segments[i]]) return null;
          node = node.children[segments[i]];
        }
        return node;
      }

      return {
        getCwd() { return cwd.join('/'); },
        getCwdShort() { return cwd.length === 1 ? '~' : '~/' + cwd.slice(1).join('/'); },

        cd(pathStr) {
          const segs = resolve(pathStr);
          const node = getNode(segs);
          if (!node) return { ok: false, error: `cd: no such directory: ${pathStr}` };
          if (node.type !== 'dir') return { ok: false, error: `cd: not a directory: ${pathStr}` };
          cwd = segs;
          return { ok: true };
        },

        ls(pathStr) {
          const segs = pathStr ? resolve(pathStr) : [...cwd];
          const node = getNode(segs);
          if (!node) return { ok: false, error: `ls: cannot access '${pathStr}': No such file or directory` };
          if (node.type !== 'dir') return { ok: false, error: `ls: '${pathStr}' is not a directory` };
          const entries = Object.entries(node.children).map(([name, n]) => ({
            name,
            isDir: n.type === 'dir',
          }));
          entries.sort((a, b) => {
            if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
            return a.name.localeCompare(b.name);
          });
          return { ok: true, entries };
        },

        cat(pathStr) {
          if (!pathStr) return { ok: false, error: 'cat: missing operand' };
          const segs = resolve(pathStr);
          const node = getNode(segs);
          if (!node) return { ok: false, error: `cat: ${pathStr}: No such file or directory` };
          if (node.type === 'dir') return { ok: false, error: `cat: ${pathStr}: Is a directory` };
          return { ok: true, content: node.content, link: node.link };
        },

        pwd() { return cwd.join('/').replace('~', '/home/' + CONTENT.username); },

        resolve,
        getNode,
      };
    })();


    // ═══════════════════════════════════════════════════════════
    // PART 3 — PARSER / RENDERER
    // ═══════════════════════════════════════════════════════════
    (() => {
      const $ = (s) => document.querySelector(s);
      const output = $('#output');
      const inputLine = $('#input-line');
      const inputEl = $('#input-field');
      const promptEl = $('#input-prompt');
      const titleBar = $('#title-bar-text');

      const HISTORY_KEY = 'azaan:history';
      const PORTAL_KEY = 'azaan:portal';
      const MAX_HISTORY = 200;

      let history = [];
      try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { history = []; }
      let historyIdx = history.length;
      let bootDone = false;
      let currentPortal = 'terminal';

      // ─── Shared helpers ───────────────────────────────────
      function escapeHTML(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // Turns the same lightweight markdown-ish CONTENT strings into HTML,
      // used by both the terminal's `cat` and the visual desktop's tiles/windows.
      function renderMarkdownLines(content, indent = true) {
        const pad = indent ? '  ' : '';
        let html = '';
        for (const line of content.split('\n')) {
          if (line.startsWith('# ')) {
            html += `<div class="line-header">${escapeHTML(line.slice(2))}</div>`;
          } else if (line.startsWith('> ')) {
            html += `<div class="line-dim">${pad}▎ ${escapeHTML(line.slice(2))}</div>`;
          } else if (line.startsWith('─')) {
            html += `<div class="line-accent">${escapeHTML(line)}</div>`;
          } else {
            html += `<div class="line-output">${pad}${escapeHTML(line)}</div>`;
          }
        }
        return html;
      }

      function scrollBottom() {
        const t = $('#terminal');
        requestAnimationFrame(() => { t.scrollTop = t.scrollHeight; });
      }

      function promptHTML() {
        const p = FS.getCwdShort();
        return `<span class="line-prompt"><span class="host">${CONTENT.username}</span><span class="at">@</span><span class="host">${CONTENT.hostname}</span><span class="colon">:</span><span class="path">${p}</span><span class="dollar">$&nbsp;</span></span>`;
      }

      function updatePrompt() {
        promptEl.innerHTML = promptHTML();
        if (currentPortal === 'terminal') {
          titleBar.textContent = `${CONTENT.username}@${CONTENT.hostname}: ${FS.getCwdShort()}`;
          document.title = `${CONTENT.username}@${CONTENT.hostname}: ${FS.getCwdShort()}`;
        }
      }

      function printRaw(html) {
        output.insertAdjacentHTML('beforeend', html);
      }

      function printLine(text, cls = 'line-output') {
        printRaw(`<div class="${cls}">${escapeHTML(text)}</div>`);
      }

      function printEcho(cmdText) {
        printRaw(`<div>${promptHTML()}<span class="line-output">${escapeHTML(cmdText)}</span></div>`);
      }

      function printBlank() { printRaw('<div>&nbsp;</div>'); }

      // ─── Commands ─────────────────────────────────────────
      const COMMANDS = {
        help() {
          const cmds = [
            ['help', 'Show this help message'],
            ['ls [dir]', 'List directory contents'],
            ['cd [dir]', 'Change directory (supports .., ~)'],
            ['cat <file>', 'Display file contents'],
            ['pwd', 'Print working directory'],
            ['whoami', 'Display identity summary'],
            ['resume', 'Open resume (PDF)'],
            ['contact', 'Show contact information'],
            ['neofetch', 'System info + ASCII art'],
            ['visual', 'Switch to the visual desktop (workspace 2)'],
            ['sudo hire-me', '???'],
            ['history', 'Show command history'],
            ['clear', 'Clear terminal'],
          ];
          printBlank();
          printLine('Available commands:', 'line-header');
          printBlank();
          for (const [cmd, desc] of cmds) {
            const padded = cmd.padEnd(24);
            printRaw(`<div><span class="line-accent">  ${escapeHTML(padded)}</span><span class="line-dim">${escapeHTML(desc)}</span></div>`);
          }
          printBlank();
          printLine('  Navigate the filesystem to explore — start with `ls` and `cd`', 'line-dim');
          printBlank();
        },

        ls(args) {
          const target = args[0] || null;
          const result = FS.ls(target);
          if (!result.ok) { printLine(result.error, 'line-error'); return; }
          printBlank();
          for (const e of result.entries) {
            const cls = e.isDir ? 'dir-name' : 'file-name';
            const suffix = e.isDir ? '/' : '';
            printRaw(`<div class="${cls}">  ${e.name}${suffix}</div>`);
          }
          printBlank();
        },

        cd(args) {
          const target = args[0] || '~';
          const result = FS.cd(target);
          if (!result.ok) printLine(result.error, 'line-error');
          updatePrompt();
        },

        cat(args) {
          if (!args.length) { printLine('cat: missing operand', 'line-error'); return; }
          const result = FS.cat(args[0]);
          if (!result.ok) { printLine(result.error, 'line-error'); return; }
          printBlank();
          printRaw(renderMarkdownLines(result.content));
          printBlank();
        },

        pwd() {
          printLine('  ' + FS.pwd());
        },

        whoami() {
          printBlank();
          printLine(`  ${CONTENT.fullName}`, 'line-accent');
          printLine(`  ${CONTENT.tagline}`, 'line-dim');
          printBlank();
        },

        resume() {
          if (!CONTENT.resumeUrl || CONTENT.resumeUrl === '#resume') {
            printLine('  resume: no URL configured — set CONTENT.resumeUrl to enable this.', 'line-yellow');
            return;
          }
          printLine('  Opening resume...', 'line-green');
          window.open(CONTENT.resumeUrl, '_blank');
        },

        contact() {
          printBlank();
          printLine('  ─── Reach Me ───────────────────────────────────', 'line-dim');
          printBlank();
          for (const l of LINKS) {
            if (l.label === 'Resume') continue;
            printRaw(`<div>  <span class="line-accent">${escapeHTML(l.label.padEnd(9))}</span><span class="line-dim"> →  </span><a class="term-link" href="${l.href}" target="_blank" rel="noopener">${escapeHTML(l.value)}</a></div>`);
          }
          printBlank();
          printLine('  Feel free to reach out — I\'m always open to', 'line-dim');
          printLine('  interesting conversations and collaborations.', 'line-dim');
          printBlank();
        },

        visual() {
          printLine('  Switching to workspace 2 (visual desktop)...', 'line-green');
          setTimeout(() => setPortal('visual'), 150);
        },

        neofetch() {
          const art = NEOFETCH_ART;
          const nf = CONTENT.neofetch;
          const infoLines = [
            { label: '', val: `${CONTENT.username}@${CONTENT.hostname}`, cls: 'line-accent line-bold' },
            { label: '', val: '─'.repeat(24), cls: 'line-dim' },
            { label: 'OS       ', val: nf.os },
            { label: 'Host     ', val: nf.host },
            { label: 'Uptime   ', val: nf.uptime },
            { label: 'Packages ', val: nf.packages },
            { label: 'Shell    ', val: nf.shell },
            { label: 'Editor   ', val: nf.editor },
            { label: 'Languages', val: nf.languages },
            { label: 'Coffee   ', val: nf.coffee },
          ];

          printBlank();
          // Build side-by-side
          const container = document.createElement('div');
          container.className = 'neofetch-row';

          const artDiv = document.createElement('div');
          artDiv.className = 'neofetch-art';
          artDiv.textContent = art.join('\n');

          const infoDiv = document.createElement('div');
          infoDiv.className = 'neofetch-info';
          for (const line of infoLines) {
            if (line.cls) {
              infoDiv.insertAdjacentHTML('beforeend',
                `<div class="${line.cls}">${line.val}</div>`);
            } else {
              infoDiv.insertAdjacentHTML('beforeend',
                `<div><span class="nf-label">${line.label}</span><span class="nf-sep"> → </span><span class="nf-val">${line.val}</span></div>`);
            }
          }
          // Color palette
          const colors = ['#f07178', '#e6b450', '#7fd962', '#39bae6', '#d4a0ff', '#ff8f40', '#546178', '#c5cdd9'];
          let paletteHTML = '<div style="margin-top:6px;display:flex;gap:3px">';
          for (const c of colors) {
            paletteHTML += `<span class="nf-palette" style="background:${c}"></span>`;
          }
          paletteHTML += '</div>';
          infoDiv.insertAdjacentHTML('beforeend', paletteHTML);

          container.appendChild(artDiv);
          container.appendChild(infoDiv);
          output.appendChild(container);
          printBlank();
        },

        sudo(args) {
          if (!args.length) {
            printLine('  usage: sudo <command>', 'line-error');
            return;
          }
          if (args.join(' ') === 'hire-me') {
            printBlank();
            printLine('  [sudo] password for guest: ********', 'line-dim');
            printLine('  ✓ Permission granted.', 'line-green');
            printLine('  Sending offer letter to your inbox... 📨', 'line-accent');
            printLine('  Just kidding — but let\'s talk! Run `contact` 😄', 'line-yellow');
            printBlank();
          } else {
            printLine(`  sudo: ${args[0]}: permission denied`, 'line-error');
          }
        },

        history() {
          printBlank();
          history.forEach((cmd, i) => {
            printRaw(`<div><span class="line-dim">  ${String(i + 1).padStart(4)}  </span><span class="line-output">${escapeHTML(cmd)}</span></div>`);
          });
          printBlank();
        },

        clear() {
          output.innerHTML = '';
        },

        // shortcut: `projects` lists all projects
        projects() {
          printBlank();
          printLine('Projects:', 'line-header');
          printBlank();
          const entries = Object.entries(CONTENT.projects);
          for (const [file, proj] of entries) {
            printRaw(`<div><span class="line-accent">  ${file.padEnd(18)}</span><span class="line-output">${proj.title}</span></div>`);
          }
          printBlank();
          printLine('  Use `cat projects/<filename>` to read details', 'line-dim');
          printBlank();
        },
      };

      // ─── Execute ──────────────────────────────────────────
      function execute(raw) {
        const trimmed = raw.trim();
        if (!trimmed) { printEcho(''); return; }

        history.push(trimmed);
        if (history.length > MAX_HISTORY) history.shift();
        historyIdx = history.length;
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch { /* storage unavailable, skip */ }
        printEcho(trimmed);

        const parts = trimmed.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1);

        // handle `sudo` specially so we can pass sub-command
        if (cmd === 'sudo') {
          COMMANDS.sudo(args);
        } else if (COMMANDS[cmd]) {
          COMMANDS[cmd](args);
        } else {
          printLine(`  command not found: ${cmd} — type 'help'`, 'line-error');
        }
        scrollBottom();
      }

      // ─── Input Handling ───────────────────────────────────
      inputEl.addEventListener('keydown', (e) => {
        if (!bootDone) return;
        if (e.key === 'Enter') {
          const val = inputEl.value;
          inputEl.value = '';
          execute(val);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (historyIdx > 0) {
            historyIdx--;
            inputEl.value = history[historyIdx];
            // move cursor to end
            requestAnimationFrame(() => inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length));
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (historyIdx < history.length - 1) {
            historyIdx++;
            inputEl.value = history[historyIdx];
          } else {
            historyIdx = history.length;
            inputEl.value = '';
          }
        } else if (e.key === 'Tab') {
          e.preventDefault();
          autocomplete(e);
        } else if (e.key === 'l' && e.ctrlKey) {
          e.preventDefault();
          COMMANDS.clear();
        }
      });

      // Tab autocomplete — double-tab shows all possibilities
      let lastTabTime = 0;
      let lastTabValue = '';

      function autocomplete(e) {
        const now = Date.now();
        const val = inputEl.value;
        const isDoubleTab = (now - lastTabTime < 500) && (val === lastTabValue);
        lastTabTime = now;
        lastTabValue = val;

        const parts = val.split(/\s+/);
        if (parts.length <= 1 && !val.endsWith(' ')) {
          // autocomplete commands
          const partial = parts[0].toLowerCase();
          const matches = Object.keys(COMMANDS).filter(c => c.startsWith(partial));
          if (matches.length === 1) {
            inputEl.value = matches[0] + ' ';
            lastTabValue = inputEl.value;
          } else if (matches.length > 1) {
            // fill common prefix
            const common = commonPrefix(matches);
            if (common.length > partial.length) {
              inputEl.value = common;
              lastTabValue = inputEl.value;
            }
            if (isDoubleTab || common.length === partial.length) {
              showCompletions(matches, false);
            }
          }
        } else {
          // autocomplete paths
          const pathPart = parts[parts.length - 1] || '';
          const slashIdx = pathPart.lastIndexOf('/');
          let dirPath, prefix;
          if (slashIdx >= 0) {
            dirPath = pathPart.slice(0, slashIdx + 1);
            prefix = pathPart.slice(slashIdx + 1);
          } else {
            dirPath = '';
            prefix = pathPart;
          }
          // Resolve the directory to list
          const lsResult = FS.ls(dirPath || null);
          if (!lsResult.ok) return;
          const matches = lsResult.entries.filter(e => e.name.startsWith(prefix));
          if (matches.length === 1) {
            const m = matches[0];
            const completion = dirPath + m.name + (m.isDir ? '/' : '');
            parts[parts.length - 1] = completion;
            inputEl.value = parts.join(' ');
            lastTabValue = inputEl.value;
          } else if (matches.length > 1) {
            // fill common prefix of filenames
            const names = matches.map(m => m.name);
            const common = commonPrefix(names);
            if (common.length > prefix.length) {
              parts[parts.length - 1] = dirPath + common;
              inputEl.value = parts.join(' ');
              lastTabValue = inputEl.value;
            }
            if (isDoubleTab || common.length === prefix.length) {
              showCompletions(matches.map(m => m.name + (m.isDir ? '/' : '')), true);
            }
          }
        }
        // keep cursor at end
        requestAnimationFrame(() => inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length));
      }

      function commonPrefix(strings) {
        if (!strings.length) return '';
        let pre = strings[0];
        for (let i = 1; i < strings.length; i++) {
          while (!strings[i].startsWith(pre)) pre = pre.slice(0, -1);
        }
        return pre;
      }

      function showCompletions(items, isPath) {
        // echo the current input, then show completions below it
        printEcho(inputEl.value);
        printBlank();
        const perRow = 3;
        for (let i = 0; i < items.length; i += perRow) {
          const row = items.slice(i, i + perRow);
          const formatted = row.map(item => {
            const padded = item.padEnd(22);
            const cls = item.endsWith('/') ? 'dir-name' : 'line-accent';
            return `<span class="${cls}">${padded}</span>`;
          }).join('');
          printRaw(`<div>  ${formatted}</div>`);
        }
        printBlank();
        scrollBottom();
      }

      // Click terminal to focus
      $('#terminal').addEventListener('click', (e) => {
        if (e.target === inputEl) return;
        // Don't steal focus if user is selecting text
        const sel = window.getSelection();
        if (sel && sel.toString().length > 0) return;
        inputEl.focus();
      });

      // Mobile quick buttons
      document.querySelectorAll('#mobile-bar button').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!bootDone) return;
          const cmd = btn.dataset.cmd;
          inputEl.value = '';
          execute(cmd);
          inputEl.focus();
        });
      });

      // ─── Boot Sequence ────────────────────────────────────
      async function boot() {
        inputLine.style.display = 'none';

        const lines = [
          { msg: 'Initializing terminal...', delay: 180 },
          { msg: 'Loading font subsystem...', delay: 120 },
          { msg: 'Mounting virtual filesystem...', delay: 250 },
          { msg: `Setting hostname → ${CONTENT.hostname}`, delay: 100 },
          { msg: 'Spawning shell process...', delay: 150 },
          { msg: `Welcome, ${CONTENT.username}.`, delay: 200 },
        ];

        const reducedMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        let skipped = reducedMotion;
        const skipHandler = () => { skipped = true; };
        document.addEventListener('keydown', skipHandler, { once: true });
        document.addEventListener('touchstart', skipHandler, { once: true });

        for (let i = 0; i < lines.length; i++) {
          if (skipped) break;
          const l = lines[i];
          const el = document.createElement('div');
          el.className = 'boot-line';
          el.style.animationDelay = '0ms';
          el.innerHTML = `<span class="boot-ok">[ OK ]</span><span class="boot-label"> ${l.msg}</span>`;
          output.appendChild(el);
          scrollBottom();
          await new Promise(r => setTimeout(r, l.delay));
        }

        document.removeEventListener('keydown', skipHandler);
        document.removeEventListener('touchstart', skipHandler);

        if (skipped) {
          // If skipped (or reduced motion requested) show them all instantly
          output.innerHTML = '';
          for (const l of lines) {
            printRaw(`<div><span class="boot-ok">[ OK ]</span><span class="boot-label"> ${l.msg}</span></div>`);
          }
        }

        await new Promise(r => setTimeout(r, skipped ? 50 : 300));

        printBlank();
        if (window.innerWidth <= 480) {
          // Box-drawing art wraps on narrow phones — plain banner instead
          printLine(`  ${CONTENT.fullName}'s Terminal Portfolio`, 'line-accent line-bold');
        } else {
          printRaw(`<div class="line-accent line-bold">  ╭─────────────────────────────────────────────╮</div>`);
          printRaw(`<div class="line-accent line-bold">  │  ${CONTENT.fullName}'s Terminal Portfolio${' '.repeat(Math.max(0, 22 - CONTENT.fullName.length))}│</div>`);
          printRaw(`<div class="line-accent line-bold">  ╰─────────────────────────────────────────────╯</div>`);
        }
        printBlank();
        printLine(`  Type 'help' to see available commands.`, 'line-green');
        printBlank();

        inputLine.style.display = 'flex';
        updatePrompt();
        if (currentPortal === 'terminal') inputEl.focus();
        bootDone = true;
        scrollBottom();
      }

      // ═══════════════════════════════════════════════════════
      // PART 4 — VISUAL DESKTOP (workspace 2)
      // ═══════════════════════════════════════════════════════
      let fwLastTrigger = null;

      function fwKeyHandler(e) {
        if (e.key === 'Escape') closeFloatingWindow();
      }

      function openFloatingWindow(title, content, triggerEl) {
        fwLastTrigger = triggerEl || document.activeElement;
        $('#fw-title').textContent = title;
        $('#fw-body').innerHTML = renderMarkdownLines(content, false);
        $('#fw-overlay').classList.remove('is-hidden');
        $('#fw-window').focus();
        document.addEventListener('keydown', fwKeyHandler);
      }

      function closeFloatingWindow() {
        $('#fw-overlay').classList.add('is-hidden');
        document.removeEventListener('keydown', fwKeyHandler);
        if (fwLastTrigger && typeof fwLastTrigger.focus === 'function') fwLastTrigger.focus();
      }

      $('#fw-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'fw-overlay') closeFloatingWindow();
      });
      $('#fw-close').addEventListener('click', closeFloatingWindow);
      $('#fw-close').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeFloatingWindow(); }
      });

      function renderPortalToggle() {
        return `<div class="portal-toggle" role="group" aria-label="Switch portal">
          <span class="pt-slider" aria-hidden="true"></span>
          <button type="button" class="pt-btn" data-portal="terminal" title="Switch to the terminal (press 1)">terminal</button>
          <button type="button" class="pt-btn" data-portal="visual" title="Switch to the visual desktop (press 2)">visual</button>
        </div>`;
      }

      function updatePortalToggle() {
        document.querySelectorAll('.portal-toggle').forEach(toggle => {
          toggle.querySelectorAll('.pt-btn').forEach(b => {
            b.classList.toggle('pt-active', b.dataset.portal === currentPortal);
          });
          const slider = toggle.querySelector('.pt-slider');
          if (slider) slider.style.transform = currentPortal === 'visual' ? 'translateX(78px)' : 'translateX(0)';
        });
      }

      function updateClock() {
        const el = $('#wm-clock');
        if (!el) return;
        const now = new Date();
        el.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      }

      function renderVisualDesktop() {
        $('#wm-about-body').innerHTML = renderMarkdownLines(CONTENT.about, false);
        $('#wm-skills-body').innerHTML = renderMarkdownLines(CONTENT.skills, false);

        const nf = CONTENT.neofetch;
        const statRows = [
          ['OS', nf.os], ['Host', nf.host], ['Shell', nf.shell],
          ['Editor', nf.editor], ['Languages', nf.languages], ['Coffee', nf.coffee],
        ];
        $('#wm-stats-body').innerHTML = `<div class="neofetch-row">
          <div class="neofetch-art">${escapeHTML(NEOFETCH_ART.join('\n'))}</div>
          <div class="neofetch-info">${statRows.map(([k, v]) =>
            `<div><span class="nf-label">${k}</span><span class="nf-sep"> → </span><span class="nf-val">${escapeHTML(v)}</span></div>`
          ).join('')}</div>
        </div>`;
        $('#wm-coffee').textContent = nf.coffee;

        $('#wm-projects-body').innerHTML = `<div class="wm-card-grid">${
          Object.entries(CONTENT.projects).map(([file, p]) => `
            <button type="button" class="wm-card" data-kind="project" data-file="${file}">
              <span class="wm-card-title">${escapeHTML(p.title)}</span>
              <span class="wm-card-meta">${file}</span>
            </button>`).join('')
        }</div>`;

        $('#wm-experience-body').innerHTML = Object.entries(CONTENT.experience).map(([file, e]) => `
          <button type="button" class="wm-card wm-card-row" data-kind="experience" data-file="${file}">
            <span class="wm-card-title">${escapeHTML(e.title)}</span>
            <span class="wm-card-arrow">›</span>
          </button>`).join('');

        $('#wm-contact-body').innerHTML = `<div class="wm-contact-grid">${
          LINKS.map(l => `
            <a class="wm-contact-link" href="${l.href}" target="_blank" rel="noopener">
              <span class="wm-contact-label">${escapeHTML(l.label)}</span>
              <span class="wm-contact-value">${escapeHTML(l.value)}</span>
            </a>`).join('')
        }</div>`;

        $('#wm-grid').addEventListener('click', (e) => {
          const btn = e.target.closest('.wm-card');
          if (!btn) return;
          const { kind, file } = btn.dataset;
          const src = kind === 'project' ? CONTENT.projects[file] : CONTENT.experience[file];
          openFloatingWindow(src.title, src.content, btn);
        });

        updateClock();
        setInterval(updateClock, 15000);
      }

      function setPortal(name, { persist = true } = {}) {
        currentPortal = name;
        const isVisual = name === 'visual';
        $('#terminal-window').classList.toggle('is-hidden', isVisual);
        $('#visual-desktop').classList.toggle('is-hidden', !isVisual);
        updatePortalToggle();
        if (isVisual) {
          document.title = `${CONTENT.username}@${CONTENT.hostname}: visual`;
          updateClock();
        } else {
          updatePrompt();
          if (bootDone) inputEl.focus();
        }
        if (persist) {
          try { localStorage.setItem(PORTAL_KEY, name); } catch { /* storage unavailable, skip */ }
        }
      }

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('.pt-btn');
        if (btn) setPortal(btn.dataset.portal);
      });

      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === '`') {
          e.preventDefault();
          setPortal(currentPortal === 'visual' ? 'terminal' : 'visual');
          return;
        }
        const typing = document.activeElement === inputEl ||
          ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
        if (!typing && (e.key === '1' || e.key === '2')) {
          setPortal(e.key === '1' ? 'terminal' : 'visual');
        }
      });

      // ─── Init ─────────────────────────────────────────────
      $('#title-bar').insertAdjacentHTML('beforeend', renderPortalToggle());
      $('#wm-bar').insertAdjacentHTML('beforeend', renderPortalToggle());
      renderVisualDesktop();

      let savedPortal = 'terminal';
      try { savedPortal = localStorage.getItem(PORTAL_KEY) || 'terminal'; } catch { savedPortal = 'terminal'; }
      if (savedPortal === 'visual') setPortal('visual', { persist: false });
      else updatePortalToggle();

      boot();
    })();
  </script>
</body>
