<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>husain@portfolio: ~</title>
  <meta name="description"
    content="Interactive terminal &amp; tiling-desktop portfolio — explore projects, skills, and experience.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="husain@portfolio: ~">
  <meta property="og:description"
    content="Interactive terminal &amp; tiling-desktop portfolio — explore projects, skills, and experience.">
  <meta name="twitter:card" content="summary">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='3' y='22' font-family='monospace' font-weight='bold' font-size='16' fill='%236eb4e8'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Set theme + portal from storage BEFORE first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('azaan:portal');
        var t = localStorage.getItem('azaan:theme');
        var el = document.documentElement;
        el.dataset.portal = (p === 'visual') ? 'visual' : 'terminal';
        el.dataset.theme = t || 'midnight';
      } catch (e) {
        document.documentElement.dataset.portal = 'terminal';
        document.documentElement.dataset.theme = 'midnight';
      }
    })();
  </script>

  <!-- Framework: Alpine.js drives the nav, themes, portal state, visual desktop & modal. -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <style>
    /* ─── Reset & Base ─────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [x-cloak] {
      display: none !important;
    }

    /* ─── Themes ───────────────────────────────────────────────
       Each theme is just a set of CSS custom properties. The
       inline head script + the Alpine store keep data-theme in
       sync on <html>, so switching is instant and persistent. */
    :root,
    html[data-theme="midnight"] {
      --bg: #000000;
      --bg-chrome: #111111;
      --bg-panel: #0a0a0c;
      --fg: #e0e0e0;
      --accent: #6eb4e8;
      --green: #73c990;
      --yellow: #d7c485;
      --red: #d98585;
      --magenta: #b895c9;
      --dim: #555555;
      --border: #333333;
      --selection: rgba(110, 180, 232, 0.2);
    }

    html[data-theme="gruvbox"] {
      --bg: #1d2021;
      --bg-chrome: #282828;
      --bg-panel: #242424;
      --fg: #ebdbb2;
      --accent: #83a598;
      --green: #b8bb26;
      --yellow: #fabd2f;
      --red: #fb4934;
      --magenta: #d3869b;
      --dim: #928374;
      --border: #3c3836;
      --selection: rgba(131, 165, 152, 0.22);
    }

    html[data-theme="nord"] {
      --bg: #2e3440;
      --bg-chrome: #3b4252;
      --bg-panel: #333a48;
      --fg: #eceff4;
      --accent: #88c0d0;
      --green: #a3be8c;
      --yellow: #ebcb8b;
      --red: #bf616a;
      --magenta: #b48ead;
      --dim: #7b869c;
      --border: #434c5e;
      --selection: rgba(136, 192, 208, 0.22);
    }

    html[data-theme="ayu"] {
      --bg: #1f2430;
      --bg-chrome: #232834;
      --bg-panel: #1c212b;
      --fg: #cbccc6;
      --accent: #5ccfe6;
      --green: #87d96c;
      --yellow: #ffd580;
      --red: #ff6666;
      --magenta: #d4bfff;
      --dim: #707a8c;
      --border: #33415e;
      --selection: rgba(92, 207, 230, 0.2);
    }

    html[data-theme="matrix"] {
      --bg: #000700;
      --bg-chrome: #041104;
      --bg-panel: #020c02;
      --fg: #c8ffc0;
      --accent: #39d353;
      --green: #56d364;
      --yellow: #7ee787;
      --red: #ff7b72;
      --magenta: #56d364;
      --dim: #2ea043;
      --border: #12401a;
      --selection: rgba(57, 211, 83, 0.22);
    }

    :root {
      --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SF Mono', 'Menlo', monospace;
      --nav-h: 48px;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--fg);
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .is-hidden {
      display: none !important;
    }

    /* ─── Global Top Nav ───────────────────────────────────── */
    #topnav {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      height: var(--nav-h);
      padding: 0 14px;
      background: var(--bg-chrome);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      user-select: none;
      z-index: 40;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .traffic-lights {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .traffic-lights span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: block;
      background: #444444;
      border: 1px solid #666666;
      transition: background .15s, border-color .15s;
    }

    .traffic-lights .tl-red:hover { background: var(--red); border-color: var(--red); cursor: pointer; }
    .traffic-lights .tl-yellow:hover { background: var(--yellow); border-color: var(--yellow); }
    .traffic-lights .tl-green:hover { background: var(--green); border-color: var(--green); }

    .nav-brand {
      background: transparent;
      border: none;
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 12.5px;
      letter-spacing: .3px;
      cursor: pointer;
      padding: 4px 2px;
      max-width: 42vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color .15s;
    }

    .nav-brand:hover,
    .nav-brand:focus-visible {
      color: var(--fg);
      outline: none;
    }

    .nav-brand .brand-caret {
      color: var(--accent);
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      margin: 0 auto 0 6px;
    }

    .nav-link {
      position: relative;
      background: transparent;
      border: none;
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: .2px;
      padding: 8px 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: color .15s, background .15s;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 4px;
      height: 1.5px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .18s ease;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      color: var(--fg);
      outline: none;
    }

    .nav-link.is-active {
      color: var(--accent);
    }

    .nav-link.is-active::after,
    .nav-link:hover::after {
      transform: scaleX(1);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Theme switcher */
    .theme-switch {
      position: relative;
    }

    .nav-icon-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 5px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }

    .nav-icon-btn:hover,
    .nav-icon-btn:focus-visible {
      color: var(--fg);
      border-color: var(--dim);
      outline: none;
    }

    .theme-glyph {
      color: var(--accent);
      font-size: 13px;
      line-height: 1;
    }

    .theme-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 190px;
      background: var(--bg-chrome);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, .5);
      z-index: 60;
    }

    .theme-opt {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 12.5px;
      text-align: left;
      padding: 7px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background .12s;
    }

    .theme-opt:hover,
    .theme-opt:focus-visible {
      background: rgba(127, 127, 127, .12);
      outline: none;
    }

    .theme-opt.is-active {
      color: var(--accent);
    }

    .theme-swatches {
      display: inline-flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .theme-swatches span {
      width: 10px;
      height: 14px;
      border-radius: 2px;
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .theme-check {
      margin-left: auto;
      color: var(--green);
    }

    /* Portal toggle (terminal | visual) */
    .portal-toggle {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px;
    }

    .pt-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 78px;
      height: calc(100% - 6px);
      background: var(--accent);
      border-radius: 3px;
      transition: transform .2s ease;
      z-index: 0;
    }

    .pt-btn {
      position: relative;
      z-index: 1;
      width: 78px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .3px;
      padding: 6px 0;
      cursor: pointer;
      border-radius: 3px;
      transition: color .15s;
    }

    .pt-btn.pt-active {
      color: #000;
      font-weight: 700;
    }

    .pt-btn:not(.pt-active):hover {
      color: var(--fg);
    }

    .pt-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .nav-resume {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 12px;
      text-decoration: none;
      padding: 6px 11px;
      border-radius: 5px;
      transition: border-color .15s, background .15s;
    }

    .nav-resume:hover,
    .nav-resume:focus-visible {
      border-color: var(--accent);
      background: rgba(110, 180, 232, 0.08);
      outline: none;
    }

    /* Hamburger (mobile only) */
    .nav-burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      width: 34px;
      height: 30px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      padding: 0 8px;
    }

    .nav-burger span {
      display: block;
      height: 1.5px;
      background: var(--fg);
      transition: transform .2s, opacity .2s;
    }

    .nav-mobile {
      display: none;
    }

    /* ─── Stage (holds the active portal) ──────────────────── */
    #stage {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    #terminal-shell,
    #visual-desktop {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    html[data-portal="visual"] #terminal-shell { display: none; }
    html[data-portal="terminal"] #visual-desktop { display: none; }

    /* ─── Terminal Body ────────────────────────────────────── */
    #terminal {
      flex: 1;
      background: var(--bg);
      padding: 16px 18px 8px;
      overflow-y: auto;
      scroll-behavior: smooth;
      cursor: text;
    }

    #terminal::-webkit-scrollbar,
    .wm-tile-body::-webkit-scrollbar,
    #wm-grid::-webkit-scrollbar,
    .fw-body::-webkit-scrollbar {
      width: 6px;
    }

    #terminal::-webkit-scrollbar-track,
    .wm-tile-body::-webkit-scrollbar-track,
    #wm-grid::-webkit-scrollbar-track,
    .fw-body::-webkit-scrollbar-track {
      background: transparent;
    }

    #terminal::-webkit-scrollbar-thumb,
    .wm-tile-body::-webkit-scrollbar-thumb,
    #wm-grid::-webkit-scrollbar-thumb,
    .fw-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    #terminal::-webkit-scrollbar-thumb:hover,
    .wm-tile-body::-webkit-scrollbar-thumb:hover,
    #wm-grid::-webkit-scrollbar-thumb:hover,
    .fw-body::-webkit-scrollbar-thumb:hover {
      background: var(--dim);
    }

    /* ─── Output Lines ─────────────────────────────────────── */
    #output {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.65;
    }

    .line-prompt { color: var(--accent); }
    .line-prompt .at { color: var(--dim); }
    .line-prompt .host { color: var(--green); }
    .line-prompt .colon { color: var(--dim); }
    .line-prompt .path { color: var(--yellow); }
    .line-prompt .dollar { color: var(--fg); }
    .line-prompt .cmd { color: var(--fg); }
    .line-output { color: var(--fg); }
    .line-error { color: var(--red); }
    .line-accent { color: var(--accent); }
    .line-green { color: var(--green); }
    .line-yellow { color: var(--yellow); }
    .line-magenta { color: var(--magenta); }
    .line-dim { color: var(--dim); }

    .term-link {
      color: var(--accent);
      text-decoration: none;
    }

    .term-link:hover,
    .term-link:focus-visible {
      text-decoration: underline;
    }

    .line-bold { font-weight: 700; }

    .line-header {
      color: var(--accent);
      font-weight: 700;
    }

    .dir-name {
      color: var(--accent);
      font-weight: 700;
    }

    .file-name { color: var(--fg); }
    .file-link { color: var(--green); }

    /* ─── Input Row ────────────────────────────────────────── */
    #input-line {
      display: flex;
      align-items: center;
      line-height: 1.65;
      min-height: 1.65em;
    }

    #input-prompt {
      white-space: nowrap;
      flex-shrink: 0;
    }

    #input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: inherit;
      caret-color: var(--accent);
      line-height: 1.65;
      padding: 0;
      margin: 0;
    }

    /* ─── Boot animation ──────────────────────────────────── */
    .boot-line {
      opacity: 0;
      animation: bootFade .25s ease forwards;
    }

    .boot-ok { color: var(--green); }
    .boot-label { color: var(--dim); }

    @keyframes bootFade {
      to { opacity: 1; }
    }

    /* ─── Mobile Quick Buttons ─────────────────────────────── */
    #mobile-bar {
      display: none;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-chrome);
      border-top: 1px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
    }

    #mobile-bar button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 0;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    #mobile-bar button:active {
      background: rgba(127, 127, 127, .14);
      border-color: var(--fg);
    }

    /* ─── Neofetch ─────────────────────────────────────────── */
    .neofetch-row {
      display: flex;
      gap: 24px;
      line-height: 1.5;
    }

    .neofetch-art {
      color: var(--accent);
      white-space: pre;
      flex-shrink: 0;
    }

    .neofetch-info {
      white-space: pre-wrap;
    }

    .nf-label {
      color: var(--accent);
      font-weight: 700;
    }

    .nf-sep { color: var(--dim); }
    .nf-val { color: var(--fg); }

    .nf-palette {
      display: inline-block;
      width: 18px;
      height: 12px;
      border-radius: 2px;
      vertical-align: middle;
    }

    /* ─── Visual Desktop (workspace 2) ─────────────────────── */
    #wm-subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
      padding: 0 14px;
      background: var(--bg-chrome);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 12px;
      color: var(--dim);
      gap: 12px;
    }

    .wm-subbar-left {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wm-subbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    #wm-clock { color: var(--fg); }

    #wm-grid {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: grid;
      gap: 14px;
      grid-template-columns: 1.6fr 1fr;
      grid-template-rows: auto auto auto;
      grid-template-areas:
        "about    experience"
        "projects experience"
        "skills   stats"
        "contact  contact";
      align-content: start;
    }

    .wm-tile {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      transition: border-color .2s;
    }

    .wm-tile.tile-flash {
      animation: tileFlash 1.1s ease;
    }

    @keyframes tileFlash {
      0% { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
      100% { border-color: var(--border); box-shadow: none; }
    }

    #wm-tile-about { grid-area: about; }
    #wm-tile-stats { grid-area: stats; }
    #wm-tile-projects { grid-area: projects; }
    #wm-tile-skills { grid-area: skills; }
    #wm-tile-experience { grid-area: experience; }
    #wm-tile-contact { grid-area: contact; }

    .wm-tile-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--dim);
      flex-shrink: 0;
    }

    .wm-tile-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .wm-tile-body {
      padding: 12px 14px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    .wm-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .wm-card {
      text-align: left;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
      font-family: var(--font-mono);
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color .15s, background .15s;
      width: 100%;
      min-width: 0;
    }

    .wm-card:hover,
    .wm-card:focus-visible {
      border-color: var(--green);
      background: rgba(115, 201, 144, 0.06);
      outline: none;
    }

    .wm-card-title {
      font-size: 13px;
      color: var(--fg);
      overflow-wrap: anywhere;
    }

    .wm-card-meta {
      font-size: 11px;
      color: var(--dim);
      overflow-wrap: anywhere;
    }

    .wm-card-row {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .wm-card-row:last-child { margin-bottom: 0; }

    .wm-card-row:hover,
    .wm-card-row:focus-visible {
      border-color: var(--magenta);
      background: rgba(184, 149, 201, 0.06);
    }

    .wm-card-arrow { color: var(--dim); }

    #wm-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      background: var(--bg-chrome);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 12px;
      color: var(--dim);
      flex-wrap: wrap;
      gap: 6px;
    }

    #wm-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    #wm-footer a:hover,
    #wm-footer a:focus-visible {
      text-decoration: underline;
    }

    .wm-heart { color: var(--red); }

    .wm-contact-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .wm-contact-link {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 140px;
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-decoration: none;
      font-family: var(--font-mono);
      transition: border-color .15s, background .15s;
    }

    .wm-contact-link:hover,
    .wm-contact-link:focus-visible {
      border-color: var(--accent);
      background: rgba(110, 180, 232, 0.06);
      outline: none;
    }

    .wm-contact-label {
      font-size: 11px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .wm-contact-value {
      font-size: 13px;
      color: var(--accent);
    }

    /* ─── Floating window (project / experience detail) ────── */
    .fw-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .fw-window {
      width: min(560px, 100%);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    .fw-window:focus { outline: none; }

    .fw-titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px;
      background: var(--bg-chrome);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .fw-title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: var(--dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fw-repo-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      color: var(--dim);
      flex-shrink: 0;
      transition: color .15s, background .15s;
    }

    .fw-repo-link:hover,
    .fw-repo-link:focus-visible {
      color: var(--fg);
      background: rgba(127, 127, 127, .14);
      outline: none;
    }

    .fw-repo-link svg {
      display: block;
    }

    .fw-body {
      padding: 16px 18px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.65;
    }

    /* ─── Responsive ───────────────────────────────────────── */
    @media (max-width: 900px) {
      #wm-grid {
        grid-template-columns: 1fr;
        grid-template-areas:
          "about"
          "experience"
          "projects"
          "skills"
          "stats"
          "contact";
      }
    }

    /* Collapse nav into a hamburger menu on tablets & phones */
    @media (max-width: 760px) {
      .nav-links,
      .nav-right .theme-switch,
      .nav-right .nav-resume {
        display: none;
      }

      .nav-burger {
        display: flex;
      }

      .nav-mobile {
        position: absolute;
        top: calc(100% + 1px);
        left: 0;
        right: 0;
        display: block;
        background: var(--bg-chrome);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 18px 44px rgba(0, 0, 0, .5);
        padding: 10px;
        z-index: 55;
      }

      .nav-mobile .nm-section {
        font-size: 10.5px;
        letter-spacing: .6px;
        text-transform: uppercase;
        color: var(--dim);
        padding: 8px 8px 4px;
      }

      .nav-mobile .nm-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        background: transparent;
        border: none;
        color: var(--fg);
        font-family: var(--font-mono);
        font-size: 14px;
        text-align: left;
        text-decoration: none;
        padding: 11px 8px;
        border-radius: 5px;
        cursor: pointer;
      }

      .nav-mobile .nm-link:active {
        background: rgba(127, 127, 127, .14);
      }

      .nav-mobile .nm-themes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 4px 8px 8px;
      }

      .nav-mobile .nm-theme {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--fg);
        font-family: var(--font-mono);
        font-size: 12px;
        padding: 6px 9px;
        border-radius: 5px;
        cursor: pointer;
      }

      .nav-mobile .nm-theme.is-active {
        border-color: var(--accent);
        color: var(--accent);
      }

      .nav-mobile .nm-divider {
        height: 1px;
        background: var(--border);
        margin: 6px 4px;
      }
    }

    @media (max-width: 640px) {
      body { font-size: 13px; }

      :root { --nav-h: 52px; }

      #topnav {
        padding: 0 10px;
        gap: 8px;
      }

      .traffic-lights { gap: 5px; }

      .traffic-lights span {
        width: 10px;
        height: 10px;
      }

      .pt-slider,
      .pt-btn { width: 62px; }

      .pt-btn {
        font-size: 11px;
        padding: 6px 0;
      }

      #terminal {
        padding: 12px 10px 6px;
        font-size: 12px;
      }

      #input-line { align-items: flex-start; }

      #input-field { min-width: 0; }

      #mobile-bar {
        display: flex;
        padding: 8px 10px;
      }

      #mobile-bar button {
        font-size: 11px;
        padding: 6px 10px;
      }

      #wm-subbar { font-size: 11px; }

      #wm-grid {
        padding: 8px;
        gap: 8px;
      }

      .wm-tile-head { padding: 7px 10px; }

      .wm-tile-body {
        padding: 10px;
        font-size: 12px;
        line-height: 1.55;
      }

      .wm-card-grid { grid-template-columns: 1fr; }

      .wm-card { padding: 9px 10px; }

      .wm-card-title,
      .wm-card-meta,
      .wm-contact-value {
        overflow-wrap: anywhere;
      }

      .wm-contact-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .wm-contact-link {
        min-width: 0;
        width: 100%;
        padding: 8px 10px;
      }

      .neofetch-row {
        flex-direction: column;
        gap: 10px;
      }

      .neofetch-art {
        max-width: 100%;
        overflow-x: auto;
        font-size: 11px;
      }

      .neofetch-info { overflow-wrap: anywhere; }

      #wm-footer {
        padding: 8px 10px;
        font-size: 11px;
        text-align: center;
      }

      .fw-overlay { padding: 8px; }

      .fw-window { max-height: calc(100dvh - 16px); }

      .fw-title {
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .fw-body {
        padding: 12px;
        font-size: 12px;
      }
    }

    @media (max-width: 380px) {
      .nav-brand { max-width: 34vw; font-size: 11px; }
      .pt-slider,
      .pt-btn { width: 56px; }
    }

    /* ─── Reduced motion ───────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .boot-line {
        animation: none;
        opacity: 1;
      }

      .wm-tile.tile-flash { animation: none; }

      .wm-card,
      .nav-link,
      .nav-link::after,
      .traffic-lights span,
      .pt-btn,
      .pt-slider {
        transition: none;
      }
    }

    /* ─── Selection ────────────────────────────────────────── */
    ::selection {
      background: var(--selection);
    }
  </style>
</head>

<body>

  <!-- ─────────────── Global top navigation ─────────────── -->
  <header id="topnav" x-data="topnav">
    <div class="nav-left">
      <div class="traffic-lights" aria-hidden="true">
        <span class="tl-red"></span>
        <span class="tl-yellow"></span>
        <span class="tl-green"></span>
      </div>
      <button class="nav-brand" @click="brandClick()" :title="$store.app.brandText()">
        <span class="brand-caret">&gt;_</span>
        <span x-text="$store.app.brandText()"></span>
      </button>
    </div>

    <nav class="nav-links" aria-label="Sections">
      <template x-for="s in $store.app.sections" :key="s.id">
        <button class="nav-link"
          :class="{ 'is-active': $store.app.portal === 'visual' && $store.app.activeSection === s.id }"
          @click="$store.app.goToSection(s.id)"
          x-text="s.label"></button>
      </template>
    </nav>

    <div class="nav-right">
      <!-- Theme switcher -->
      <div class="theme-switch" @click.outside="themeOpen = false" @keydown.escape="themeOpen = false">
        <button type="button" class="nav-icon-btn" @click="themeOpen = !themeOpen"
          :aria-expanded="themeOpen" aria-haspopup="true" aria-label="Change color theme">
          <span class="theme-glyph" aria-hidden="true">◐</span>
          <span x-text="$store.app.themeLabel()"></span>
        </button>
        <div class="theme-menu" x-show="themeOpen" x-transition x-cloak role="menu">
          <template x-for="t in $store.app.themes" :key="t.id">
            <button type="button" class="theme-opt" role="menuitem"
              :class="{ 'is-active': $store.app.theme === t.id }"
              @click="$store.app.setTheme(t.id); themeOpen = false">
              <span class="theme-swatches" aria-hidden="true">
                <span :style="`background:${t.sw[0]}`"></span>
                <span :style="`background:${t.sw[1]}`"></span>
                <span :style="`background:${t.sw[2]}`"></span>
              </span>
              <span x-text="t.label"></span>
              <span class="theme-check" x-show="$store.app.theme === t.id" aria-hidden="true">✓</span>
            </button>
          </template>
        </div>
      </div>

      <!-- Portal toggle -->
      <div class="portal-toggle" role="group" aria-label="Switch view">
        <span class="pt-slider" :style="$store.app.portal === 'visual' ? 'transform:translateX(100%)' : 'transform:translateX(0)'" aria-hidden="true"></span>
        <button type="button" class="pt-btn" :class="{ 'pt-active': $store.app.portal === 'terminal' }"
          @click="$store.app.setPortal('terminal')" title="Terminal (press 1)">terminal</button>
        <button type="button" class="pt-btn" :class="{ 'pt-active': $store.app.portal === 'visual' }"
          @click="$store.app.setPortal('visual')" title="Visual desktop (press 2)">visual</button>
      </div>

      <a class="nav-resume" :href="$store.app.resumeUrl" target="_blank" rel="noopener">resume ↗</a>

      <!-- Hamburger (mobile) -->
      <button type="button" class="nav-burger" @click="mobileOpen = !mobileOpen"
        :aria-expanded="mobileOpen" aria-label="Menu" aria-controls="nav-mobile">
        <span></span><span></span><span></span>
      </button>
    </div>

    <!-- Mobile dropdown menu -->
    <div class="nav-mobile" id="nav-mobile" x-show="mobileOpen" x-transition x-cloak
      @click.outside="mobileOpen = false">
      <div class="nm-section">Sections</div>
      <template x-for="s in $store.app.sections" :key="s.id">
        <button type="button" class="nm-link"
          @click="$store.app.goToSection(s.id); mobileOpen = false">
          <span x-text="s.label"></span>
          <span aria-hidden="true" style="color:var(--dim)">›</span>
        </button>
      </template>
      <div class="nm-divider"></div>
      <div class="nm-section">Theme</div>
      <div class="nm-themes">
        <template x-for="t in $store.app.themes" :key="t.id">
          <button type="button" class="nm-theme" :class="{ 'is-active': $store.app.theme === t.id }"
            @click="$store.app.setTheme(t.id)">
            <span class="theme-swatches" aria-hidden="true">
              <span :style="`background:${t.sw[0]}`"></span>
              <span :style="`background:${t.sw[1]}`"></span>
              <span :style="`background:${t.sw[2]}`"></span>
            </span>
            <span x-text="t.label"></span>
          </button>
        </template>
      </div>
      <div class="nm-divider"></div>
      <a class="nm-link" :href="$store.app.resumeUrl" target="_blank" rel="noopener" @click="mobileOpen = false">
        <span>Resume</span><span aria-hidden="true">↗</span>
      </a>
    </div>
  </header>

  <!-- ─────────────── Stage: active portal ─────────────── -->
  <main id="stage">

    <!-- Terminal portal -->
    <section id="terminal-shell">
      <div id="terminal" tabindex="-1">

                <span class="wm-card-title" x-text="e.title"></span>
                <span class="wm-card-arrow" aria-hidden="true">›</span>
              </button>
            </template>
          </div>
        </section>

        <section class="wm-tile" id="wm-tile-contact">
          <header class="wm-tile-head"><span class="wm-tile-dot" style="background:var(--accent)"></span>~/contact</header>
          <div class="wm-tile-body">
            <div class="wm-contact-grid">
              <template x-for="l in links" :key="l.label">
                <a class="wm-contact-link" :href="l.href" target="_blank" rel="noopener">
                  <span class="wm-contact-label" x-text="l.label"></span>
                  <span class="wm-contact-value" x-text="l.value"></span>
                </a>
              </template>
            </div>
          </div>
        </section>
      </div>

      <div id="wm-footer">
        made with <span class="wm-heart">♥</span> by
        <a href="https://github.com/zxan" target="_blank" rel="noopener">Azaan Husain</a>
        &nbsp;·&nbsp;
        <a href="https://zxan.github.io" target="_blank" rel="noopener">view source on GitHub</a>
      </div>

      <!-- Floating detail window -->
      <div class="fw-overlay" x-show="modal.open" x-transition.opacity x-cloak
        @click.self="closeWindow()" @keydown.escape.window="modal.open && closeWindow()">
        <div class="fw-window" x-ref="fwWindow" tabindex="-1" role="dialog" aria-modal="true"
          :aria-label="modal.title">
          <div class="fw-titlebar">
            <div class="traffic-lights">
              <span class="tl-red" role="button" tabindex="0" aria-label="Close window (Esc)"

            </div>

            <a class="fw-repo-link" x-show="modal.repo" x-cloak :href="modal.repo" target="_blank"

                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
              </svg>
            </a>
          </div>
          <div class="fw-body" x-html="modal.html"></div>
        </div>
      </div>
    </section>
  </main>

        `     ╰──────────╯  `,
        `       ┃      ┃    `,
        `    ╭──┸──────┸──╮ `,
        `    ╰─────────────╯ `,
      ];

      // Color themes — id, label, and 3 swatch colors for the picker.
      const THEMES = [
        { id: 'midnight', label: 'Midnight', sw: ['#000000', '#6eb4e8', '#73c990'] },
        { id: 'gruvbox', label: 'Gruvbox', sw: ['#1d2021', '#83a598', '#fabd2f'] },
        { id: 'nord', label: 'Nord', sw: ['#2e3440', '#88c0d0', '#a3be8c'] },
        { id: 'ayu', label: 'Ayu', sw: ['#1f2430', '#5ccfe6', '#ffd580'] },
        { id: 'matrix', label: 'Matrix', sw: ['#000700', '#39d353', '#7ee787'] },
      ];

      // Nav sections — each maps to a terminal command AND a visual tile id.
      const SECTIONS = [
        { id: 'about', label: 'About', cmd: 'cat about.txt' },
        { id: 'projects', label: 'Projects', cmd: 'projects' },
        { id: 'skills', label: 'Skills', cmd: 'cat skills.txt' },
        { id: 'experience', label: 'Experience', cmd: 'experience' },
        { id: 'contact', label: 'Contact', cmd: 'contact' },
      ];


      // ═══════════════════════════════════════════════════════════
      // PART 2 — SHARED UTILITIES
      // ═══════════════════════════════════════════════════════════
      function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // Turns the lightweight markdown-ish CONTENT strings into HTML,
      // used by both the terminal's `cat` and the visual desktop's tiles/windows.
      function renderMarkdown(content, indent = true) {
        const pad = indent ? '  ' : '';
        let html = '';
        for (const line of content.split('\n')) {
          if (line.startsWith('# ')) {
            html += `<div class="line-header">${escapeHtml(line.slice(2))}</div>`;
          } else if (line.startsWith('> ')) {
            html += `<div class="line-dim">${pad}▎ ${escapeHtml(line.slice(2))}</div>`;
          } else if (line.startsWith('─')) {
            html += `<div class="line-accent">${escapeHtml(line)}</div>`;
          } else {
            html += `<div class="line-output">${pad}${escapeHtml(line)}</div>`;
          }
        }
        return html;
      }

      // Side-by-side ASCII art + system info, for the visual ~/neofetch tile.
      function buildNeofetchHtml() {
        const nf = CONTENT.neofetch;
        const rows = [
          ['OS', nf.os], ['Host', nf.host], ['Shell', nf.shell],
          ['Editor', nf.editor], ['Languages', nf.languages], ['Coffee', nf.coffee],
        ];
        return `<div class="neofetch-row">
          <div class="neofetch-art">${escapeHtml(NEOFETCH_ART.join('\n'))}</div>
          <div class="neofetch-info">${rows.map(([k, v]) =>
            `<div><span class="nf-label">${k}</span><span class="nf-sep"> → </span><span class="nf-val">${escapeHtml(v)}</span></div>`
          ).join('')}</div>
        </div>`;
      }


      // ═══════════════════════════════════════════════════════════
      // PART 3 — VIRTUAL FILESYSTEM
      // ═══════════════════════════════════════════════════════════
      const FS = (() => {
        const tree = {
          type: 'dir',
          children: {
            'about.txt': { type: 'file', content: CONTENT.about },
            'skills.txt': { type: 'file', content: CONTENT.skills },
            'contact.txt': { type: 'file', content: CONTENT.contact },
            'resume.pdf': { type: 'file', content: '[binary — use the `resume` command to open]', link: CONTENT.resumeUrl },
            'projects': {
              type: 'dir',
              children: Object.fromEntries(
                Object.entries(CONTENT.projects).map(([name, p]) => [name, { type: 'file', content: p.content }])
              ),
            },
            'experience': {
              type: 'dir',
              children: Object.fromEntries(
                Object.entries(CONTENT.experience).map(([name, e]) => [name, { type: 'file', content: e.content }])
              ),
            },
          },
        };

        let cwd = ['~'];

        function resolve(pathStr) {
          if (!pathStr || pathStr === '~') return ['~'];
          let parts;
          if (pathStr.startsWith('~/')) {
            parts = ['~', ...pathStr.slice(2).split('/').filter(Boolean)];
          } else if (pathStr.startsWith('/')) {
            parts = ['~', ...pathStr.slice(1).split('/').filter(Boolean)];
          } else {
            parts = [...cwd, ...pathStr.split('/').filter(Boolean)];
          }
          const resolved = [];
          for (const p of parts) {
            if (p === '.') continue;
            if (p === '..') { if (resolved.length > 1) resolved.pop(); continue; }
            resolved.push(p);
          }
          if (resolved.length === 0) resolved.push('~');
          return resolved;
        }

        function getNode(segments) {
          let node = tree;
          for (let i = 1; i < segments.length; i++) {
            if (!node || node.type !== 'dir' || !node.children[segments[i]]) return null;
            node = node.children[segments[i]];
          }
          return node;
        }

        return {
          getCwd() { return cwd.join('/'); },
          getCwdShort() { return cwd.length === 1 ? '~' : '~/' + cwd.slice(1).join('/'); },

          cd(pathStr) {
            const segs = resolve(pathStr);
            const node = getNode(segs);
            if (!node) return { ok: false, error: `cd: no such directory: ${pathStr}` };
            if (node.type !== 'dir') return { ok: false, error: `cd: not a directory: ${pathStr}` };
            cwd = segs;
            return { ok: true };
          },

          ls(pathStr) {
            const segs = pathStr ? resolve(pathStr) : [...cwd];
            const node = getNode(segs);
            if (!node) return { ok: false, error: `ls: cannot access '${pathStr}': No such file or directory` };
            if (node.type !== 'dir') return { ok: false, error: `ls: '${pathStr}' is not a directory` };
            const entries = Object.entries(node.children).map(([name, n]) => ({
              name,
              isDir: n.type === 'dir',
            }));
            entries.sort((a, b) => {
              if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
              return a.name.localeCompare(b.name);
            });
            return { ok: true, entries };
          },

          cat(pathStr) {
            if (!pathStr) return { ok: false, error: 'cat: missing operand' };
            const segs = resolve(pathStr);
            const node = getNode(segs);
            if (!node) return { ok: false, error: `cat: ${pathStr}: No such file or directory` };
            if (node.type === 'dir') return { ok: false, error: `cat: ${pathStr}: Is a directory` };
            return { ok: true, content: node.content, link: node.link };
          },

          pwd() { return cwd.join('/').replace('~', '/home/' + CONTENT.username); },

          resolve,
          getNode,
        };
      })();


      // ═══════════════════════════════════════════════════════════
      // PART 4 — TERMINAL ENGINE
      //   Imperative REPL — the right tool for a streaming shell.
      //   Alpine calls into it via the returned API (window.Terminal).
      // ═══════════════════════════════════════════════════════════
      function initTerminal() {
        const $ = (s) => document.querySelector(s);
        const output = $('#output');
        const inputLine = $('#input-line');
        const inputEl = $('#input-field');
        const promptEl = $('#input-prompt');

        const HISTORY_KEY = 'azaan:history';
        const MAX_HISTORY = 200;

        let history = [];
        try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { history = []; }
        let historyIdx = history.length;
        let bootDone = false;

        function scrollBottom() {
          const t = $('#terminal');
          requestAnimationFrame(() => { t.scrollTop = t.scrollHeight; });
        }

        function promptHTML() {
          const p = FS.getCwdShort();
          return `<span class="line-prompt"><span class="host">${CONTENT.username}</span><span class="at">@</span><span class="host">${CONTENT.hostname}</span><span class="colon">:</span><span class="path">${p}</span><span class="dollar">$&nbsp;</span></span>`;
        }

        function updatePrompt() {
          promptEl.innerHTML = promptHTML();
          const store = window.Alpine && Alpine.store('app');
          if (store) store.setCwd(FS.getCwdShort());
        }

        function printRaw(html) {
          output.insertAdjacentHTML('beforeend', html);
        }

        function printLine(text, cls = 'line-output') {
          printRaw(`<div class="${cls}">${escapeHtml(text)}</div>`);
        }

        function printEcho(cmdText) {
          printRaw(`<div>${promptHTML()}<span class="line-output">${escapeHtml(cmdText)}</span></div>`);
        }

        function printBlank() { printRaw('<div>&nbsp;</div>'); }

        // ─── Commands ─────────────────────────────────────────
        const COMMANDS = {
          help() {
            const cmds = [
              ['help', 'Show this help message'],
              ['ls [dir]', 'List directory contents'],
              ['cd [dir]', 'Change directory (supports .., ~)'],
              ['cat <file>', 'Display file contents'],
              ['pwd', 'Print working directory'],
              ['whoami', 'Display identity summary'],
              ['projects', 'List projects'],
              ['experience', 'List experience'],
              ['resume', 'Open resume (PDF)'],
              ['contact', 'Show contact information'],
              ['neofetch', 'System info + ASCII art'],
              ['theme [name]', 'Switch color theme'],
              ['visual', 'Switch to the visual desktop (workspace 2)'],
              ['sudo hire-me', '???'],
              ['history', 'Show command history'],
              ['clear', 'Clear terminal'],
            ];
            printBlank();
            printLine('Available commands:', 'line-header');
            printBlank();
            for (const [cmd, desc] of cmds) {
              const padded = cmd.padEnd(24);
              printRaw(`<div><span class="line-accent">  ${escapeHtml(padded)}</span><span class="line-dim">${escapeHtml(desc)}</span></div>`);
            }
            printBlank();
            printLine('  Navigate the filesystem to explore — start with `ls` and `cd`', 'line-dim');
            printLine('  Tip: the nav bar up top mirrors these commands.', 'line-dim');
            printBlank();
          },

          ls(args) {
            const target = args[0] || null;
            const result = FS.ls(target);
            if (!result.ok) { printLine(result.error, 'line-error'); return; }
            printBlank();
            for (const e of result.entries) {
              const cls = e.isDir ? 'dir-name' : 'file-name';
              const suffix = e.isDir ? '/' : '';
              printRaw(`<div class="${cls}">  ${e.name}${suffix}</div>`);
            }
            printBlank();
          },

          cd(args) {
            const target = args[0] || '~';
            const result = FS.cd(target);
            if (!result.ok) printLine(result.error, 'line-error');
            updatePrompt();
          },

          cat(args) {
            if (!args.length) { printLine('cat: missing operand', 'line-error'); return; }
            const result = FS.cat(args[0]);
            if (!result.ok) { printLine(result.error, 'line-error'); return; }
            printBlank();
            printRaw(renderMarkdown(result.content));
            printBlank();
          },

          pwd() {
            printLine('  ' + FS.pwd());
          },

          whoami() {
            printBlank();
            printLine(`  ${CONTENT.fullName}`, 'line-accent');
            printLine(`  ${CONTENT.tagline}`, 'line-dim');
            printBlank();
          },

          resume() {
            if (!CONTENT.resumeUrl || CONTENT.resumeUrl === '#resume') {
              printLine('  resume: no URL configured — set CONTENT.resumeUrl to enable this.', 'line-yellow');
              return;
            }
            printLine('  Opening resume...', 'line-green');
            window.open(CONTENT.resumeUrl, '_blank');
          },

          contact() {
            printBlank();
            printLine('  ─── Reach Me ───────────────────────────────────', 'line-dim');
            printBlank();
            for (const l of LINKS) {
              if (l.label === 'Resume') continue;
              printRaw(`<div>  <span class="line-accent">${escapeHtml(l.label.padEnd(9))}</span><span class="line-dim"> →  </span><a class="term-link" href="${l.href}" target="_blank" rel="noopener">${escapeHtml(l.value)}</a></div>`);
            }
            printBlank();
            printLine('  Feel free to reach out — I\'m always open to', 'line-dim');
            printLine('  interesting conversations and collaborations.', 'line-dim');
            printBlank();
          },

          theme(args) {
            const store = window.Alpine && Alpine.store('app');
            if (!store) return;
            if (!args.length) {
              printBlank();
              printLine('  Available themes:', 'line-header');
              printBlank();
              for (const t of store.themes) {
                const active = t.id === store.theme ? '  (active)' : '';
                printRaw(`<div>  <span class="line-accent">${escapeHtml(t.id.padEnd(12))}</span><span class="line-output">${escapeHtml(t.label)}</span><span class="line-green">${active}</span></div>`);
              }
              printBlank();
              printLine('  Usage: theme <name>', 'line-dim');
              printBlank();
              return;
            }
            const name = args[0].toLowerCase();
            if (store.themes.some(t => t.id === name)) {
              store.setTheme(name);
              printLine(`  Theme set to ${name}.`, 'line-green');
            } else {
              printLine(`  theme: unknown theme '${name}' — run 'theme' to list`, 'line-error');
            }
          },

          visual() {
            printLine('  Switching to workspace 2 (visual desktop)...', 'line-green');
            const store = window.Alpine && Alpine.store('app');
            setTimeout(() => { if (store) store.setPortal('visual'); }, 150);
          },

          neofetch() {
            const art = NEOFETCH_ART;
            const nf = CONTENT.neofetch;
            const infoLines = [
              { label: '', val: `${CONTENT.username}@${CONTENT.hostname}`, cls: 'line-accent line-bold' },
              { label: '', val: '─'.repeat(24), cls: 'line-dim' },
              { label: 'OS       ', val: nf.os },
              { label: 'Host     ', val: nf.host },
              { label: 'Uptime   ', val: nf.uptime },
              { label: 'Packages ', val: nf.packages },
              { label: 'Shell    ', val: nf.shell },
              { label: 'Editor   ', val: nf.editor },
              { label: 'Languages', val: nf.languages },
              { label: 'Coffee   ', val: nf.coffee },
            ];

            printBlank();
            const container = document.createElement('div');
            container.className = 'neofetch-row';

            const artDiv = document.createElement('div');
            artDiv.className = 'neofetch-art';
            artDiv.textContent = art.join('\n');

            const infoDiv = document.createElement('div');
            infoDiv.className = 'neofetch-info';
            for (const line of infoLines) {
              if (line.cls) {
                infoDiv.insertAdjacentHTML('beforeend',
                  `<div class="${line.cls}">${escapeHtml(line.val)}</div>`);
              } else {
                infoDiv.insertAdjacentHTML('beforeend',
                  `<div><span class="nf-label">${line.label}</span><span class="nf-sep"> → </span><span class="nf-val">${escapeHtml(line.val)}</span></div>`);
              }
            }
            const colors = ['#f07178', '#e6b450', '#7fd962', '#39bae6', '#d4a0ff', '#ff8f40', '#546178', '#c5cdd9'];
            let paletteHTML = '<div style="margin-top:6px;display:flex;gap:3px">';
            for (const c of colors) {
              paletteHTML += `<span class="nf-palette" style="background:${c}"></span>`;
            }
            paletteHTML += '</div>';
            infoDiv.insertAdjacentHTML('beforeend', paletteHTML);

            container.appendChild(artDiv);
            container.appendChild(infoDiv);
            output.appendChild(container);
            printBlank();
          },

          sudo(args) {
            if (!args.length) {
              printLine('  usage: sudo <command>', 'line-error');
              return;
            }
            if (args.join(' ') === 'hire-me') {
              printBlank();
              printLine('  [sudo] password for guest: ********', 'line-dim');
              printLine('  ✓ Permission granted.', 'line-green');
              printLine('  Sending offer letter to your inbox... 📨', 'line-accent');
              printLine('  Just kidding — but let\'s talk! Run `contact` 😄', 'line-yellow');
              printBlank();
            } else {
              printLine(`  sudo: ${args[0]}: permission denied`, 'line-error');
            }
          },

          history() {
            printBlank();
            history.forEach((cmd, i) => {
              printRaw(`<div><span class="line-dim">  ${String(i + 1).padStart(4)}  </span><span class="line-output">${escapeHtml(cmd)}</span></div>`);
            });
            printBlank();
          },

          clear() {
            output.innerHTML = '';
          },

          projects() {
            printBlank();
            printLine('Projects:', 'line-header');
            printBlank();
            const entries = Object.entries(CONTENT.projects);
            for (const [file, proj] of entries) {
              printRaw(`<div><span class="line-accent">  ${escapeHtml(file.padEnd(24))}</span><span class="line-output">${escapeHtml(proj.title)}</span></div>`);
            }
            printBlank();
            printLine('  Use `cat projects/<filename>` to read details', 'line-dim');
            printBlank();
          },

          experience() {
            printBlank();
            printLine('Experience:', 'line-header');
            printBlank();
            const entries = Object.entries(CONTENT.experience);
            for (const [file, exp] of entries) {
              printRaw(`<div><span class="line-accent">  ${escapeHtml(file.padEnd(30))}</span><span class="line-output">${escapeHtml(exp.title)}</span></div>`);
            }
            printBlank();
            printLine('  Use `cat experience/<filename>` to read details', 'line-dim');
            printBlank();
          },
        };

        // ─── Execute ──────────────────────────────────────────
        function execute(raw) {
          const trimmed = raw.trim();
          if (!trimmed) { printEcho(''); return; }

          history.push(trimmed);
          if (history.length > MAX_HISTORY) history.shift();
          historyIdx = history.length;
          try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch { /* storage unavailable, skip */ }
          printEcho(trimmed);

          const parts = trimmed.split(/\s+/);
          const cmd = parts[0].toLowerCase();
          const args = parts.slice(1);

          if (cmd === 'sudo') {
            COMMANDS.sudo(args);
          } else if (COMMANDS[cmd]) {
            COMMANDS[cmd](args);
          } else {
            printLine(`  command not found: ${cmd} — type 'help'`, 'line-error');
          }
          scrollBottom();
        }

        // ─── Input Handling ───────────────────────────────────
        inputEl.addEventListener('keydown', (e) => {
          if (!bootDone) return;
          if (e.key === 'Enter') {
            const val = inputEl.value;
            inputEl.value = '';
            execute(val);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (historyIdx > 0) {
              historyIdx--;
              inputEl.value = history[historyIdx];
              requestAnimationFrame(() => inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length));
            }
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIdx < history.length - 1) {
              historyIdx++;
              inputEl.value = history[historyIdx];
            } else {
              historyIdx = history.length;
              inputEl.value = '';
            }
          } else if (e.key === 'Tab') {
            e.preventDefault();
            autocomplete(e);
          } else if (e.key === 'l' && e.ctrlKey) {
            e.preventDefault();
            COMMANDS.clear();
          }
        });

        // Tab autocomplete — double-tab shows all possibilities
        let lastTabTime = 0;
        let lastTabValue = '';
        const PATH_COMPLETION_CMDS = new Set(['cat', 'cd', 'ls']);

        function autocomplete() {
          const now = Date.now();
          const val = inputEl.value;
          const isDoubleTab = (now - lastTabTime < 500) && (val === lastTabValue);
          lastTabTime = now;
          lastTabValue = val;

          const parts = val.split(/\s+/);
          if (parts.length <= 1 && !val.endsWith(' ')) {
            const partial = parts[0].toLowerCase();
            const matches = Object.keys(COMMANDS).filter(c => c.startsWith(partial));
            if (matches.length === 1) {
              inputEl.value = matches[0] + ' ';
              lastTabValue = inputEl.value;
            } else if (matches.length > 1) {
              const common = commonPrefix(matches);
              if (common.length > partial.length) {
                inputEl.value = common;
                lastTabValue = inputEl.value;
              }
              if (isDoubleTab || common.length === partial.length) {
                showCompletions(matches, false);
              }
            }
          } else {
            const cmdName = parts[0].toLowerCase();
            const pathPart = parts[parts.length - 1] || '';

            if (cmdName === 'theme') {
              // theme <name> — complete against installed theme ids, not the filesystem
              const prefix = pathPart.toLowerCase();
              const matches = THEMES.map(t => t.id).filter(id => id.startsWith(prefix));
              if (matches.length === 1) {
                parts[parts.length - 1] = matches[0];
                inputEl.value = parts.join(' ') + ' ';
                lastTabValue = inputEl.value;
              } else if (matches.length > 1) {
                const common = commonPrefix(matches);
                if (common.length > prefix.length) {
                  parts[parts.length - 1] = common;
                  inputEl.value = parts.join(' ');
                  lastTabValue = inputEl.value;
                }
                if (isDoubleTab || common.length === prefix.length) {
                  showCompletions(matches, false);
                }
              }
            } else if (PATH_COMPLETION_CMDS.has(cmdName)) {
              const slashIdx = pathPart.lastIndexOf('/');
              let dirPath, prefix;
              if (slashIdx >= 0) {
                dirPath = pathPart.slice(0, slashIdx + 1);
                prefix = pathPart.slice(slashIdx + 1);
              } else {
                dirPath = '';
                prefix = pathPart;
              }
              const lsResult = FS.ls(dirPath || null);
              if (!lsResult.ok) return;
              const matches = lsResult.entries.filter(e => e.name.startsWith(prefix));
              if (matches.length === 1) {
                const m = matches[0];
                const completion = dirPath + m.name + (m.isDir ? '/' : '');
                parts[parts.length - 1] = completion;
                inputEl.value = parts.join(' ');
                lastTabValue = inputEl.value;
              } else if (matches.length > 1) {
                const names = matches.map(m => m.name);
                const common = commonPrefix(names);
                if (common.length > prefix.length) {
                  parts[parts.length - 1] = dirPath + common;
                  inputEl.value = parts.join(' ');
                  lastTabValue = inputEl.value;
                }
                if (isDoubleTab || common.length === prefix.length) {
                  showCompletions(matches.map(m => m.name + (m.isDir ? '/' : '')), true);
                }
              }
            }
            // else: no arg completion defined for this command — no-op
          }
          requestAnimationFrame(() => inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length));
        }

        function commonPrefix(strings) {
          if (!strings.length) return '';
          let pre = strings[0];
          for (let i = 1; i < strings.length; i++) {
            while (!strings[i].startsWith(pre)) pre = pre.slice(0, -1);
          }
          return pre;
        }

        function showCompletions(items) {
          printEcho(inputEl.value);
          printBlank();
          const perRow = 3;
          for (let i = 0; i < items.length; i += perRow) {
            const row = items.slice(i, i + perRow);
            const formatted = row.map(item => {
              const padded = item.padEnd(22);
              const cls = item.endsWith('/') ? 'dir-name' : 'line-accent';
              return `<span class="${cls}">${escapeHtml(padded)}</span>`;
            }).join('');
            printRaw(`<div>  ${formatted}</div>`);
          }
          printBlank();
          scrollBottom();
        }

        // Click terminal to focus
        $('#terminal').addEventListener('click', (e) => {
          if (e.target === inputEl) return;
          const sel = window.getSelection();
          if (sel && sel.toString().length > 0) return;
          inputEl.focus();
        });

        // Mobile quick buttons
        document.querySelectorAll('#mobile-bar button').forEach(btn => {
          btn.addEventListener('click', () => {
            if (!bootDone) return;
            const cmd = btn.dataset.cmd;
            inputEl.value = '';
            execute(cmd);
            inputEl.focus();
          });
        });

        // ─── Boot Sequence ────────────────────────────────────
        async function boot() {
          inputLine.style.display = 'none';

          const lines = [
            { msg: 'Initializing terminal...', delay: 180 },
            { msg: 'Loading font subsystem...', delay: 120 },
            { msg: 'Mounting virtual filesystem...', delay: 250 },
            { msg: `Setting hostname → ${CONTENT.hostname}`, delay: 100 },
            { msg: 'Spawning shell process...', delay: 150 },
            { msg: `Welcome, ${CONTENT.username}.`, delay: 200 },
          ];

          const reducedMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
          let skipped = reducedMotion;
          const skipHandler = () => { skipped = true; };
          document.addEventListener('keydown', skipHandler, { once: true });
          document.addEventListener('touchstart', skipHandler, { once: true });

          for (let i = 0; i < lines.length; i++) {
            if (skipped) break;
            const l = lines[i];
            const el = document.createElement('div');
            el.className = 'boot-line';
            el.style.animationDelay = '0ms';
            el.innerHTML = `<span class="boot-ok">[ OK ]</span><span class="boot-label"> ${escapeHtml(l.msg)}</span>`;
            output.appendChild(el);
            scrollBottom();
            await new Promise(r => setTimeout(r, l.delay));
          }

          document.removeEventListener('keydown', skipHandler);
          document.removeEventListener('touchstart', skipHandler);

          if (skipped) {
            output.innerHTML = '';
            for (const l of lines) {
              printRaw(`<div><span class="boot-ok">[ OK ]</span><span class="boot-label"> ${escapeHtml(l.msg)}</span></div>`);
            }
          }

          await new Promise(r => setTimeout(r, skipped ? 50 : 300));

          printBlank();
          if (window.innerWidth <= 480) {
            printLine(`  ${CONTENT.fullName}'s Terminal Portfolio`, 'line-accent line-bold');
          } else {
            printRaw(`<div class="line-accent line-bold">  ╭─────────────────────────────────────────────╮</div>`);
            printRaw(`<div class="line-accent line-bold">  │  ${CONTENT.fullName}'s Terminal Portfolio${' '.repeat(Math.max(0, 22 - CONTENT.fullName.length))}│</div>`);
            printRaw(`<div class="line-accent line-bold">  ╰─────────────────────────────────────────────╯</div>`);
          }
          printBlank();
          printLine(`  Type 'help' to see available commands.`, 'line-green');
          printBlank();

          inputLine.style.display = 'flex';
          updatePrompt();
          const store = window.Alpine && Alpine.store('app');
          if (!store || store.portal === 'terminal') inputEl.focus();
          bootDone = true;
          scrollBottom();
        }

        boot();

        // Public API used by Alpine (nav links, portal switch).
        return {
          run(cmd) { if (bootDone) execute(cmd); },
          focus() { requestAnimationFrame(() => inputEl.focus()); },
          isBooted() { return bootDone; },
        };
      }


      // ═══════════════════════════════════════════════════════════
      // PART 5 — ALPINE WIRING (store + components)
      // ═══════════════════════════════════════════════════════════
      document.addEventListener('alpine:init', () => {
        const el = document.documentElement;

        Alpine.store('app', {
          portal: el.dataset.portal === 'visual' ? 'visual' : 'terminal',
          theme: el.dataset.theme || 'midnight',
          cwd: '~',
          activeSection: 'about',
          user: CONTENT.username,
          host: CONTENT.hostname,
          resumeUrl: CONTENT.resumeUrl,
          sections: SECTIONS,
          themes: THEMES,

          brandText() {
            return this.portal === 'terminal'
              ? `${this.user}@${this.host}:${this.cwd}`
              : `${this.user}@${this.host}`;
          },

          themeLabel() {
            const t = this.themes.find(x => x.id === this.theme);
            return t ? t.label : 'Theme';
          },

          setPortal(p) {
            this.portal = p;
            document.documentElement.dataset.portal = p;
            try { localStorage.setItem('azaan:portal', p); } catch { /* skip */ }
            if (p === 'terminal') {
              document.title = `${this.user}@${this.host}: ${this.cwd}`;
              if (window.Terminal) window.Terminal.focus();
            } else {
              document.title = `${this.user}@${this.host}: visual`;
            }
          },

          togglePortal() {
            this.setPortal(this.portal === 'visual' ? 'terminal' : 'visual');
          },

          setTheme(t) {
            this.theme = t;
            document.documentElement.dataset.theme = t;
            try { localStorage.setItem('azaan:theme', t); } catch { /* skip */ }
          },

          setCwd(c) {
            this.cwd = c;
            if (this.portal === 'terminal') document.title = `${this.user}@${this.host}: ${c}`;
          },

          goToSection(id) {
            const s = this.sections.find(x => x.id === id);
            if (!s) return;
            if (this.portal === 'terminal') {
              if (window.Terminal) { window.Terminal.run(s.cmd); window.Terminal.focus(); }
            } else {
              this.activeSection = id;
              const tile = document.getElementById('wm-tile-' + id);
              if (tile) {
                tile.scrollIntoView({ behavior: 'smooth', block: 'start' });
                tile.classList.remove('tile-flash');
                void tile.offsetWidth; // restart the flash animation
                tile.classList.add('tile-flash');
              }
            }
          },
        });

        Alpine.data('topnav', () => ({
          mobileOpen: false,
          themeOpen: false,
          brandClick() {
            Alpine.store('app').setPortal('terminal');
            if (window.Terminal) window.Terminal.focus();
          },
        }));

        Alpine.data('visualDesktop', () => ({
          projects: Object.entries(CONTENT.projects).map(([file, p]) => ({ file, title: p.title, repo: p.repo || null, content: p.content })),
          experience: Object.entries(CONTENT.experience).map(([file, e]) => ({ file, title: e.title, content: e.content })),
          links: LINKS,
          aboutHtml: renderMarkdown(CONTENT.about, false),
          skillsHtml: renderMarkdown(CONTENT.skills, false),
          neofetchHtml: buildNeofetchHtml(),
          coffee: CONTENT.neofetch.coffee,
          time: '',
          modal: { open: false, title: '', repo: null, html: '' },
          _lastFocus: null,

          init() {
            this.updateClock();
            setInterval(() => this.updateClock(), 15000);
            this.$nextTick(() => this.observeSections());
          },

          updateClock() {
            const d = new Date();
            this.time = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
          },

          observeSections() {
            const grid = document.getElementById('wm-grid');
            if (!grid || typeof IntersectionObserver === 'undefined') return;
            const io = new IntersectionObserver((entries) => {
              entries.forEach(en => {
                if (en.isIntersecting) {
                  Alpine.store('app').activeSection = en.target.id.replace('wm-tile-', '');
                }
              });
            }, { root: grid, threshold: 0.55 });
            this.$el.querySelectorAll('.wm-tile').forEach(t => io.observe(t));
          },

          openWindow(item, ev) {
            this._lastFocus = ev && ev.currentTarget ? ev.currentTarget : null;
            this.modal = { open: true, title: item.title, repo: item.repo || null, html: renderMarkdown(item.content, false) };
            this.$nextTick(() => { if (this.$refs.fwWindow) this.$refs.fwWindow.focus(); });
          },

          closeWindow() {
            this.modal.open = false;
            if (this._lastFocus && typeof this._lastFocus.focus === 'function') this._lastFocus.focus();
          },
        }));
      });

      // Boot the terminal engine once Alpine (and the store) is live.
      document.addEventListener('alpine:initialized', () => {
        window.Terminal = initTerminal();

        // Global shortcuts: 1 = terminal, 2 = visual, Ctrl+` = toggle.
        document.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === '`') {
            e.preventDefault();
            Alpine.store('app').togglePortal();
            return;
          }
          const ae = document.activeElement;
          const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
          if (!typing && (e.key === '1' || e.key === '2')) {
            Alpine.store('app').setPortal(e.key === '1' ? 'terminal' : 'visual');
          }
        });
      });
    })();
  </script>
</body>
